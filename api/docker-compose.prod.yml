# Production compose (VPS): API + MongoDB.
# Mongo is never published on a host port, only reachable via the internal
# Docker network between the two services. Public exposure of the API
# (direct port + TLS reverse proxy, or VPN/tunnel): decision deferred, to be
# settled once the VPS is provisioned.
services:
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build: .
    environment:
      API_KEY: ${API_KEY}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
