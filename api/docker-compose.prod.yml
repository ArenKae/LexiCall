# Production compose (VPS): API only. MongoDB is a shared instance owned and
# operated outside this repo (see the private ops docs for how it's
# provisioned) — this file only expects to find it reachable on the external
# `lexicall-db` Docker network. Nothing here creates, starts, stops, or owns
# the data volume for that instance.
services:
  api:
    build: .
    container_name: lexicall-api
    environment:
      API_KEY: ${API_KEY}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - lexicall-db
    restart: unless-stopped

networks:
  lexicall-db:
    external: true
